version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: orderease_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: orderease_user
      POSTGRES_PASSWORD: orderease_secure_password_2026
      POSTGRES_DB: orderease_kiosk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U orderease_user -d orderease_kiosk_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orderease_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orderease_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://orderease_user:orderease_secure_password_2026@postgres:5432/orderease_kiosk_db
      SYNC_DATABASE_URL: postgresql+psycopg2://orderease_user:orderease_secure_password_2026@postgres:5432/orderease_kiosk_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SECRET_KEY: orderease_enterprise_jwt_rsa_secret_2026
      TABLE_TOKEN_SECRET: orderease_kiosk_table_token_secret_key_2026
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head &&
             python seed_data.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: orderease_celery_worker
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://orderease_user:orderease_secure_password_2026@postgres:5432/orderease_kiosk_db
      SYNC_DATABASE_URL: postgresql+psycopg2://orderease_user:orderease_secure_password_2026@postgres:5432/orderease_kiosk_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.core.celery_app.celery_app worker -l info

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: orderease_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: orderease_gateway
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
