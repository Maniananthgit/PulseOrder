name: Continuous Integration & Verification Pipeline

on:
  push:
    branches: [ "master", "main", "develop" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  # ==========================================================================
  # 1. Backend Testing & Verification (Python / FastAPI / SQLAlchemy / Postgres / Redis / Pytest)
  # ==========================================================================
  backend-test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orderease_user
          POSTGRES_PASSWORD: orderease_secure_password_2026
          POSTGRES_DB: orderease_kiosk_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        working-directory: ./Demo_kiosk/backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Migrations
        working-directory: ./Demo_kiosk/backend
        env:
          DATABASE_URL: postgresql+asyncpg://orderease_user:orderease_secure_password_2026@localhost:5432/orderease_kiosk_db
          SYNC_DATABASE_URL: postgresql+psycopg2://orderease_user:orderease_secure_password_2026@localhost:5432/orderease_kiosk_db
        run: |
          alembic upgrade head

      - name: Run Pytest Suite with Coverage
        working-directory: ./Demo_kiosk/backend
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://orderease_user:orderease_secure_password_2026@localhost:5432/orderease_kiosk_db
          SYNC_DATABASE_URL: postgresql+psycopg2://orderease_user:orderease_secure_password_2026@localhost:5432/orderease_kiosk_db
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_ci_only_32_chars_long!!
        run: |
          pytest -v --asyncio-mode=auto

  # ==========================================================================
  # 2. Frontend Testing & Verification (Flutter / Dart / Provider / MVVM / GoRouter)
  # ==========================================================================
  frontend-test:
    name: Flutter Testing Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: "stable"
          cache: true

      - name: Install Flutter Dependencies
        working-directory: ./Demo_kiosk/frontend
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: ./Demo_kiosk/frontend
        run: flutter analyze

      - name: Run Flutter Tests
        working-directory: ./Demo_kiosk/frontend
        run: flutter test --reporter expanded

      - name: Build Flutter Web Client
        working-directory: ./Demo_kiosk/frontend
        run: flutter build web --release --no-tree-shake-icons

  # ==========================================================================
  # 3. Docker Compose Verification (Docker / Linux Containers)
  # ==========================================================================
  docker-build:
    name: Docker Compose Build Verification
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        working-directory: ./Demo_kiosk
        run: docker compose config

